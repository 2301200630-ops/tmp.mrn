<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>hola te amo</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Lluvia de corazones -->
  <div id="fondo-corazones"></div>

  <!-- Caja Interactiva Principal -->
  <main class="caja-principal">
    
    <!-- Estado 1: La Carta Cerrada -->
    <div id="vista-carta" class="pantalla-seccion">
      <h2>¡Toca aquí para abrir tu carta! ✨</h2>
      <div class="emoji-sobre">💌</div>
      <button type="button" class="btn-rosa">Abrir. 💘</button>
    </div>

    <!-- Estado 2: Los Versos (Oculto al inicio) -->
    <div id="vista-versos" class="pantalla-seccion oculto">
      <h1>💖</h1>
      <div class="versos">
        <p id="texto-verso">Cargando...</p>
      </div>
      <button id="btn-continuar" type="button" class="btn-rosa">Continuar. 💝</button>
    </div>

  </main>

  <script src="script.js"></script>
</body>
</html>
