<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title> My Love. 💕</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Contenedor al fondo para la lluvia de corazones -->
  <div id="fondo-corazones"></div>

  <!-- Pantalla inicial: Carta cerrada -->
  <div id="carta-overlay" onclick="abrirCarta()">
    <div class="carta-box">
      <h2>¡Dale tap a la pantalla para abrir la carta! ✨</h2>
      <div class="emoji-sobre">💌</div>
    </div>
  </div>

  <!-- Caja principal de texto (Rosa Pastel) -->
  <main class="caja-principal">
    <div class="contenido-verso">
      <h1> 🎀</h1>
      
      <!-- Se muestra cada verso aquí -->
      <div class="versos">
        <p id="texto-verso">Cargando verso...</p>
      </div>

      <!-- Botón para avanzar entre los versos -->
      <button id="btn-continuar" onclick="siguienteVerso()">Continuar. 💘</button>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html
