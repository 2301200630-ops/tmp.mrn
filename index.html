<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Love. 💕</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Contenedor al fondo para la lluvia de corazones -->
  <div id="fondo-corazones"></div>

  <!-- Pantalla inicial: Carta cerrada -->
  <div id="carta-overlay" onclick="abrirCarta()">
    <div class="carta-box">
      <h2>¡Click! ✨</h2>
    
    </div>
  </div>

  <!-- Caja de texto principal (versos) -->
  <main class="caja-principal">
    <div class="contenido-verso">
      <h1>💖</h1>
      
      <div class="versos">
        <p>"Eres Andrómeda, eres anestesia.
          Supongo que eres parte de mis días. 
          Eres un tanto porciento en mi vida.
          "</p>
      </div>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
