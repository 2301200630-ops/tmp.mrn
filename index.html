<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Para mi Negro 💕 </title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Contenedor al fondo para la lluvia de corazones -->
  <div id="fondo-corazones"></div>

  <!-- Pantalla inicial: Carta cerrada -->
  <div id="carta-overlay" onclick="abrirCarta()">
    <div class="carta-box">
      <h2>¡Dale tap a la pantalla para abrir la carta! ✨</h2>
      <!-- Si tienes la imagen de Hello Kitty, pon su nombre aquí -->
      <img src="hello-kitty-goth.png" alt="Hello Kitty Goth" class="kitty-img">
    </div>
  </div>

  <!-- Caja de texto principal (versos) -->
  <main class="caja-principal">
    <div class="contenido-verso">
      <h1> Dos Soledades. </h1>
      
      <div class="versos">
        <p>"Se acabo un vacío cuando nos encontramos"</p>
        <p>"Y se abrió una puerta cuando nos acercamos"</p>
        <p>"Dos soledades o ninguna.."</p>
        <p>"Y llenamos al mundo de felicidad.💞" </p>
      </div>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
