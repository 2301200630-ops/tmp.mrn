<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Para Thon 🖤</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Contenedor al fondo para la lluvia de corazones -->
  <div id="fondo-corazones"></div>

  <!-- Pantalla inicial: Carta cerrada -->
  <div id="carta-overlay" onclick="abrirCarta()">
    <div class="carta-box">
      <h2>¡Dale tap a la pantalla para abrir la carta! ✨</h2>
    <!-- Estado 1: La Carta Cerrada -->
    <div id="vista-carta" class="pantalla-seccion">
      <h2>¡Toca aquí para abrir tu carta! ✨</h2>
      <div class="emoji-sobre">💌</div>
      <button type="button" class="btn-rosa">Abrir. 💘</button>
    </div>
  </div>

  <!-- Caja de texto principal (versos) -->
  <main class="caja-principal">
    <div class="contenido-verso">
      <h1>Mi Negro.💖</h1>
      
      <div class="versos">
        <p>"Eres Andrómeda, eres anestesia,"</p>
        <p>"Supongo que eres parte de mis días."</p>
        <p>"Eres un tanto porciento en mi vida,"</p>
      </div>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
