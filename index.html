<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Love 💕</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Fondo para corazones -->
  <div id="fondo-corazones"></div>

  <!-- Pantalla de la carta inicial -->
  <div id="carta-overlay">
    <div class="carta-box">
      <h2>¡Dale tap a la pantalla para abrir la carta! ✨</h2>
      <div class="emoji-sobre">💌</div>
    </div>
  </div>

  <!-- Caja principal -->
  <main class="caja-principal">
    <div class="contenido-verso">
      <h1>🎀</h1>
      
      <div class="versos">
        <p id="texto-verso">Cargando...</p>
      </div>

      <button id="btn-continuar" type="button">Continuar. 💘</button>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
